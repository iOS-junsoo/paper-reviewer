<script>
  const _f = window.fetch;
  window.fetch = (u, o) => {
    if (typeof u === "string" && u.indexOf("/api/") === 0)
      return Promise.resolve(new Response("[]", { status: 200, headers: { "Content-Type": "application/json" } }));
    return _f ? _f(u, o) : Promise.reject(new Error("no fetch"));
  };
  window.SPECS = {};
  window.renderSpec = function (spec) {
    try { if (window.activeMethodViz && window.activeMethodViz.destroy) window.activeMethodViz.destroy(); } catch (e) {}
    const mount = document.getElementById("mount");
    mount.innerHTML = "";
    const el = window.buildMethodViz(spec);
    document.getElementById("th-note").textContent = el ? "렌더 OK" : "spec 무효 → 폴백(null)";
    if (el) mount.appendChild(el);
    return !!el;
  };
</script>
